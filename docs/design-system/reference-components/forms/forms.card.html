<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../styles.css" />
    <style>
      html,
      body {
        margin: 0;
      }
      body {
        font-family: var(--font-sans);
        background: var(--color-bg);
        padding: 20px;
        box-sizing: border-box;
      }
      * {
        box-sizing: border-box;
      }
      .grp {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      .cap {
        font-size: 11.5px;
        color: var(--color-text-muted);
        letter-spacing: 0.04em;
        margin: 0 0 8px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
    <script src="../../_ds_bundle.js"></script>
    <script type="text/babel">
      const { Field, TextInput, Select, Checkbox, Radio, Button } =
        window.BAHNAUTODesignSystem_9a8a8a;

      function Demo() {
        const [v, setV] = React.useState("자차");
        const [ok, setOk] = React.useState(false);
        return (
          <div
            style={{
              display: "grid",
              gridTemplateColumns: "1fr 1fr",
              gap: 20,
              alignItems: "start",
            }}
          >
            <div style={{ display: "grid", gap: 14 }}>
              <Field label="성함" required htmlFor="n">
                <TextInput id="n" placeholder="홍길동" />
              </Field>
              <Field label="연락처" required htmlFor="t" error="올바른 휴대폰 번호를 입력해 주세요">
                <TextInput id="t" invalid defaultValue="010-12" inputMode="numeric" />
              </Field>
              <Field label="매장 업종" required htmlFor="s">
                <Select
                  id="s"
                  placeholder="선택해 주세요"
                  options={[
                    "무인키즈카페",
                    "무인카페",
                    "무인아이스크림",
                    "무인문구",
                    "무인세탁",
                    "무인스터디카페",
                    "기타",
                  ]}
                />
              </Field>
              <Field label="문의 내용" htmlFor="m" hint="최대 500자">
                <TextInput id="m" multiline rows={3} placeholder="매장 상황을 알려주세요" />
              </Field>
            </div>
            <div style={{ display: "grid", gap: 16 }}>
              <div>
                <p className="cap">RADIO</p>
                <Radio
                  name="mv"
                  columns={3}
                  value={v}
                  onChange={(e) => setV(e.target.value)}
                  options={["자차", "대중교통", "도보"]}
                />
              </div>
              <div>
                <p className="cap">CHECKBOX · 동의</p>
                <div style={{ display: "grid", gap: 4 }}>
                  <Checkbox
                    id="p"
                    required
                    checked={ok}
                    onChange={(e) => setOk(e.target.checked)}
                    label="개인정보 수집·이용 동의"
                    description="수집 항목: 성함·연락처 / 목적: 도입 상담 / 보유 기간: 상담 종료 후 6개월"
                  />
                  <Checkbox id="mk" label="마케팅 정보 수신 동의" />
                </div>
              </div>
              <Button size="lg" full disabled={!ok}>
                {ok ? "상담 신청하기" : "필수 동의 후 신청할 수 있습니다"}
              </Button>
            </div>
          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
    </script>
  </body>
</html>
