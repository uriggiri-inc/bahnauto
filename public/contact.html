<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>이동합니다 — 반오토</title>
    <!--
      옛 주소 이정표. 2026-08-14 까지 이 주소에 손으로 만든 정적 페이지가 있었고,
      Next.js 사이트로 교체되면서 주소 체계가 바뀌었다(끝에 슬래시가 붙는다).
      검색엔진 수첩이나 누군가의 북마크에 남은 옛 주소가 빈 화면으로 끝나지 않게 한다.

      link[rel=canonical] 로 정본을 알리고, meta refresh 로 사람을 보낸다.
      GitHub Pages 는 서버 리다이렉트(301)를 지원하지 않아 이 방법을 쓴다 —
      301 이 아니므로 검색엔진에는 canonical 쪽이 더 강한 신호다.
    -->
    <link rel="canonical" href="https://bahnauto.kr/contact/" />
    <meta name="robots" content="noindex, follow" />
    <meta http-equiv="refresh" content="0; url=https://bahnauto.kr/contact/" />
  </head>
  <body>
    <p>페이지가 이동했습니다. <a href="https://bahnauto.kr/contact/">여기</a>를 누르세요.</p>
  </body>
</html>
