      <!--
        ========================================================================
        문의 폼 자리

        GitHub Pages는 정적 파일만 서빙하므로 POST를 직접 받을 수 없습니다.
        외부 폼 서비스를 연결한 뒤 아래 주석을 풀고 action 주소를 교체하세요.

          Formspree   https://formspree.io      무료 50건/월
          Web3Forms   https://web3forms.com     무료 250건/월

        연결 시 반드시 함께 넣어야 하는 것:
          - 개인정보 수집·이용 동의 체크박스 (개인정보보호법상 필수)
          - 스팸 방지용 honeypot 필드 (아래 .hp 클래스, 화면에서 숨겨짐)

        <form class="form" action="https://formspree.io/f/XXXXXXXX" method="POST">
          <div class="field">
            <label for="name">이름 <span class="req">*</span></label>
            <input type="text" id="name" name="name" required autocomplete="name">
          </div>
          <div class="field">
            <label for="email">이메일 <span class="req">*</span></label>
            <input type="email" id="email" name="email" required autocomplete="email">
          </div>
          <div class="field">
            <label for="company">회사명</label>
            <input type="text" id="company" name="company" autocomplete="organization">
          </div>
          <div class="field">
            <label for="message">문의 내용 <span class="req">*</span></label>
            <textarea id="message" name="message" rows="6" required></textarea>
          </div>
          <div class="field hp" aria-hidden="true">
            <label for="website">이 칸은 비워두세요</label>
            <input type="text" id="website" name="_gotcha" tabindex="-1" autocomplete="off">
          </div>
          <div class="field field-check">
            <input type="checkbox" id="agree" name="agree" required>
            <label for="agree">
              개인정보 수집·이용에 동의합니다. 수집 항목은 이름·이메일·회사명이며,
              문의 응대 목적으로 1년간 보관 후 파기합니다. <span class="req">*</span>
            </label>
          </div>
          <button class="btn btn-primary" type="submit">문의 보내기</button>
        </form>
        ========================================================================
      -->
    </div>
  </section>
