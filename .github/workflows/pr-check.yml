name: PR 검사

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: HTML 문법 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HTMLHint 실행
        run: npx --yes htmlhint "**/*.html"

  pages:
    name: 페이지 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 인코딩 · 파일명 · 링크 · 필수파일 확인
        run: python3 tools/check-pages.py
